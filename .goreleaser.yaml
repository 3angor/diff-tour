# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: diff-tour

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tour
    main: ./cmd/tour
    binary: tour
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.ja.md

checksum:
  name_template: checksums.txt

# brew install init-co-jp/tap/diff-tour
# Needs the HOMEBREW_TAP_GITHUB_TOKEN secret (a token that can push to init-co-jp/homebrew-tap);
# without it the release still succeeds and the cask is not updated.
homebrew_casks:
  - name: diff-tour
    binaries: [tour]
    repository:
      owner: init-co-jp
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_GITHUB_TOKEN "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/init-co-jp/diff-tour
    description: Walk through a diff the way a senior engineer reads it
    license: MIT
    commit_author:
      name: diff-tour release
      email: release@diff-tour.invalid
    hooks:
      post:
        # The binaries are not notarized, so remove the quarantine flag macOS sets on downloads
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tour"]
          end

changelog:
  use: git
  sort: asc
  format: "{{ .Message }}"
  filters:
    exclude:
      - "^Merge "

release:
  draft: true
