# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: diff-tour

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tour
    main: ./cmd/tour
    binary: tour
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README.ja.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  draft: true
